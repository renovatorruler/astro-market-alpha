[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-market"
version = "0.1.0"
description = "Walk-forward evaluation of simple astrological indicator rules vs S&P 500 buy-and-hold"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Astro Market Alpha" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.28",
    "skyfield>=1.46",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
astro-folklore = "astro_market.folklore:main"
astro-null = "astro_market.null:main"
astro-search = "astro_market.search:main"
astro-sweep = "astro_market.sweep:main"
astro-sweep-v3 = "astro_market.sweep_v3:main"
astro-fx-folklore = "astro_market.fx.folklore:main"
astro-fx-sim = "astro_market.fx.folklore:sim_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
