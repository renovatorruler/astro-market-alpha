# Default research protocol — NEVER tune on holdout.

asset:
  ticker: "^GSPC"
  # Adjusted close from yfinance. Note: total-return series (with dividends)
  # would be preferable for long-horizon BH comparisons; adj close is a proxy.
  price_col: "Adj Close"
  cache_path: "data/gspc_adj_close.parquet"

splits:
  train: ["1970-01-01", "1994-12-31"]
  validation: ["1995-01-01", "2009-12-31"]
  holdout: ["2010-01-01", null]  # null = present

position:
  # long when rule True, flat (0) when False; BH = always long
  long: 1.0
  flat: 0.0

costs:
  bps_per_side: 10.0  # 10 basis points per side on position changes

walk_forward:
  embargo_days: 5  # trading days embargo for internal WF helpers

ephemeris:
  bsp_path: "data/de421.bsp"
  # Geocentric tropical approximation via skyfield ecliptic longitude

atoms:
  cache_path: "data/atoms.parquet"
  planets:
    - sun
    - moon
    - mercury
    - venus
    - mars
    - jupiter
    - saturn
  aspect_orb_deg: 3.0
  station_window_days: 3
  ingress_windows: [1, 3, 5]

evaluate:
  risk_free: 0.0
  complexity_lambda: 0.01

null:
  n_sims: 1000
  seed: 42

folklore_rules:
  - "moon_phase_new"
  - "moon_phase_full"
  - "mercury_retro"
  - "~mercury_retro"
  - "moon_phase_new | moon_phase_full"

atoms_v2:
  cache_path: "data/atoms_v2.parquet"
  aspect_orbs: [1.0, 3.0, 5.0]

sweep_v2:
  beam: 200
  lambda_l3: 0.015
  mc_n: 5000
  max_episode_days: 400
